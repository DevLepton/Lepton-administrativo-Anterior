<div class="sidenav" [ngClass]="collapsed ? 'sidenav-collapsed': ''">
    <div class="logo-container">
        <img src="../../assets/isotipo vect color_iconos para routes.svg" alt="logo" class="logo" (click)="toggleCollapsed()">
        
        <div class="logo-text" @fadeInOut *ngIf="collapsed">LeptónCore</div>
        <button class="btn-close" @rotate *ngIf="collapsed" (click)="closeSidenav()">
            <i class="fal fa-times close-icon"></i>
        </button>
    </div>
    <ul class="sidenav-nav">
        <li class="sidenav-nav-item" *ngFor="let data of navData">
            <a class="sidenav-nav-link" [routerLink]="[data.RouteLink]"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{exact: true}"
                [class.active-parent]="hasActiveChild(data)">

                <i class="sidenav-link-icon" [class]="data.icon"></i>
                <span class="sidenav-link-text" @fadeInOut *ngIf="collapsed">
                    {{data.label}}
                </span>
            </a>

            <ul class="sidenav-subnav" *ngIf="collapsed && hasChildren(data) && hasActiveChild(data)" @fadeInOut>
                <li class="sidenav-subnav-item" *ngFor="let child of data.children">
                    <a class="sidenav-subnav-link" [routerLink]="[child.RouteLink]" routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}">
                        <i class="sidenav-subnav-icon" [class]="child.icon"></i>
                        <span class="sidenav-subnav-text">{{ child.label }}</span>
                    </a>
                </li>
            </ul>
        </li>
    </ul>

</div>
