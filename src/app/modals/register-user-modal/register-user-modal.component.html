<div *ngIf="showModal" class="mat-elevation-z8 modal-backdrop" (click)="onBackdropClick($event)">
  <div class="panel" (click)="$event.stopPropagation()">
    <h2 class="title">Registrar nuevo usuario</h2>

    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-flex">

      <mat-form-field appearance="outline">
        <mat-label>Nombre de usuario</mat-label>
        <input matInput formControlName="userName" placeholder="">
        <mat-error *ngIf="form.get('userName')?.hasError('required')">Nombre requerido</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" formControlName="email" placeholder="correo@lepton-seguridad.com">
        <mat-error *ngIf="form.get('email')?.hasError('required')">Correo requerido</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Correo inválido</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hide ? 'password' : 'text'" formControlName="password"
          placeholder="Mínimo 6 caracteres">
        <button mat-icon-button matSuffix type="button" (click)="hide = !hide" aria-label="Mostrar/ocultar">
          <mat-icon>{{ hide ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('password')?.hasError('required')">Contraseña requerida</mat-error>
        <mat-error *ngIf="form.get('password')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Rol</mat-label>
        <mat-select formControlName="role">
          <mat-option value="admin">Admin</mat-option>
          <mat-option value="finanzas">Finanzas</mat-option>
          <mat-option value="soporte">Soporte</mat-option>
          <mat-option value="inventario">Inventario</mat-option>
          <mat-option value="cx">Experiencia del cliente</mat-option>
        </mat-select>
      </mat-form-field>

    </form>
    <div class="actions">
      <button mat-button color="warn" class="custom-button" type="button" (click)="close()" [disabled]="loading">
        Cancelar
      </button>

      <button mat-flat-button color="primary" type="submit" class="custom-button" [disabled]="form.invalid || loading">
        <mat-icon class="mr-1" *ngIf="!loading">person_add</mat-icon>
        {{ loading ? 'Registrando…' : 'Registrar' }}
      </button>
    </div>
  </div>
</div>
