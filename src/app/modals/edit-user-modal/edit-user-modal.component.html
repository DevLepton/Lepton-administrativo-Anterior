<div *ngIf="showModal" class="mat-elevation-z8 modal-backdrop" (click)="onBackdropClick($event)">
  <div class="panel" (click)="$event.stopPropagation()">
    <h2 class="title">Editar usuario</h2>

    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

    <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4">

      <mat-form-field appearance="outline">
        <mat-label>Nombre de usuario</mat-label>
        <input matInput formControlName="userName" placeholder="" />
        <mat-error *ngIf="form.get('userName')?.hasError('required')">Nombre requerido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" formControlName="email" placeholder="usuario@lepton-seguridad.com" />
        <mat-error *ngIf="form.get('email')?.hasError('required')">Correo requerido</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Correo inválido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" placeholder="(Opcional)">
        <button mat-icon-button matSuffix type="button" (click)="hide = !hide" aria-label="Mostrar/ocultar contraseña">
          <mat-icon>{{ hide ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>


      <mat-form-field appearance="outline">
        <mat-label>Rol</mat-label>
        <mat-select formControlName="role">
          <mat-option value="admin">Admin</mat-option>
          <mat-option value="finanzas">Finanzas</mat-option>
          <mat-option value="soporte">Soporte</mat-option>
          <mat-option value="inventario">Inventario</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('role')?.hasError('required')">Rol requerido</mat-error>
      </mat-form-field>

      <div class="actions">
        <button mat-stroked-button class="cancel-btn" type="button" (click)="close()" [disabled]="loading">
          Cancelar
        </button>

        <button mat-raised-button color="primary" type="submit" class="submit-btn"
          [disabled]="form.invalid || loading || !hasChanges()">
          <mat-icon class="mr-1" *ngIf="!loading">save</mat-icon>
          {{ loading ? 'Guardando…' : 'Guardar' }}
        </button>

      </div>
    </form>
  </div>
</div>
